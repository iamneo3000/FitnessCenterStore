name: 🏋️ Fitness Center Store — Keep Alive

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase para evitar pausa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - name: 📡 Ping Supabase — tabla config
        run: |
          echo "🏋️ Haciendo ping a Supabase — $(date)"

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://xnlumxmzmcfpamjfsyec.supabase.co/rest/v1/config?select=clave&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP Status config: $RESPONSE"
          [ "$RESPONSE" = "200" ] && echo "✅ Supabase activo" || echo "⚠️ Respuesta: $RESPONSE"

      - name: 📡 Ping Supabase — tabla productos
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://xnlumxmzmcfpamjfsyec.supabase.co/rest/v1/productos?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP Status productos: $RESPONSE"
          [ "$RESPONSE" = "200" ] && echo "✅ Tabla productos OK" || echo "⚠️ Respuesta: $RESPONSE"

      - name: 🌐 Ping GitHub Pages
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://iamneo3000.github.io/FitnessCenterStore/")
          echo "GitHub Pages: $RESPONSE"
          [ "$RESPONSE" = "200" ] && echo "✅ Sitio activo" || echo "⚠️ Status: $RESPONSE"

      - name: 📊 Resumen
        run: |
          echo "================================================"
          echo "  🏋️ FITNESS CENTER STORE — KEEP ALIVE"
          echo "  Fecha: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "  Frecuencia: cada 12 horas"
          echo "================================================"
