name: 🏋️ Fitness Center Store — Keep Alive

on:
  schedule:
    - cron: '0 8 */2 * *'   # cada 2 días — margen amplio vs 7 días de Supabase
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Mantener Supabase activo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔍 Query real a Postgres via REST
        run: |
          echo "📅 $(date '+%Y-%m-%d %H:%M:%S UTC')"

          # Query que fuerza actividad real en Postgres
          HTTP=$(curl -s -o /tmp/r1.txt -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 10 \
            "${{ secrets.SUPABASE_URL }}/rest/v1/config?select=clave,valor&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Accept: application/json" \
            -H "Prefer: count=exact" \
            || echo "000")

          echo "→ HTTP Status: $HTTP"
          cat /tmp/r1.txt
          echo ""

      - name: 🔍 Query real a tabla productos
        run: |
          HTTP=$(curl -s -o /tmp/r2.txt -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 10 \
            "${{ secrets.SUPABASE_URL }}/rest/v1/productos?select=id,name&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Accept: application/json" \
            -H "Prefer: count=exact" \
            || echo "000")

          echo "→ HTTP Status productos: $HTTP"
          cat /tmp/r2.txt
          echo ""

      - name: ⚡ Ping via Edge Function (activa el motor completamente)
        run: |
          # Llamada al health endpoint de Supabase — activa la DB a nivel motor
          HTTP=$(curl -s -o /tmp/r3.txt -w "%{http_code}" \
            --max-time 20 \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            || echo "000")

          echo "→ Health endpoint: $HTTP"

      - name: 📊 Resultado
        run: |
          echo ""
          echo "============================================"
          echo "  ✅ Keep-alive completado — $(date '+%Y-%m-%d')"
          echo "  🗓  Próxima ejecución: en 2 días"
          echo "  🔗 Supabase: xnlumxmzmcfpamjfsyec"
          echo "============================================"
